name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
        working-directory: portfolio
      - run: npm run typecheck
        working-directory: portfolio
      - run: npm run build
        working-directory: portfolio

  user-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: user-docs/package-lock.json
      - run: npm ci
        working-directory: user-docs
      - run: npm audit --omit=dev --audit-level=high
        working-directory: user-docs
      - run: npm run typecheck
        working-directory: user-docs
      - run: npm run build
        working-directory: user-docs

  # Garde-fou sur les montées d'image : une majeure de base de données n'est pas
  # un changement de tag, c'est une migration de données. Échoue la PR pour
  # forcer la lecture — un label seul se survole, une CI rouge non.
  image-bumps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classer les changements d'image par risque
        run: ./scripts/check-image-bumps.sh "origin/${{ github.base_ref }}"

  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          find ansible/control-node ansible/roles/scheduled_tasks/files/scripts scripts \
            -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Compose syntax
        run: |
          while IFS= read -r file; do
            docker compose -f "$file" config --no-interpolate --quiet
          done < <(find services -type f \( -name 'docker-compose.yml' -o -name 'compose.yaml' \) \
            ! -path '*/monitoring/netbox/*' | sort)
          docker compose -f user-docs/docker-compose.yml config --quiet
      - name: Prevent private prompting context
        run: test -z "$(git ls-files prompting)"
      - name: Validate encrypted secret structure
        run: |
          test -z "$(git ls-files ':(glob)**/.env')"
          while IFS= read -r encrypted_file; do
            grep -q '^sops_age__list_0__map_recipient=' "$encrypted_file"
            grep -q '^sops_mac=ENC\[' "$encrypted_file"
          done < <(find services -type f -name '*.enc.env' | sort)
