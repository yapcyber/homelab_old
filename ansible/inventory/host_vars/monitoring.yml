---
scheduled_tasks:
  - {name: backup, description: "Sauvegarde quotidienne bases + configs", calendar: "01:30", random_delay: 30m, script: backup.sh}
  - {name: docker-health, description: "Health-check horaire des conteneurs", calendar: hourly, script: docker-health.sh}
  - {name: git-drift, description: "Anti-dérive Git quotidien", calendar: "07:00", random_delay: 15m, user: debian, script: git-drift.sh}
  - {name: gitops-apply, description: "Deploiement GitOps (pull + compose, retour git si degrade)", calendar: "*:0/10", random_delay: 2m, user: debian, timeout: 20min, script: gitops-apply.sh}
  - {name: restore-reminder, description: "Rappel mensuel test de restauration", calendar: "*-*-01 10:00", script: restore-reminder.sh}

backup_jobs:
  10-grafana: |
    docker cp -q grafana:/var/lib/grafana - | gzip > "$DAILY/grafana-data.tar.gz"
docker_restricted_ports: [3000, 3001, 3100, 8082, 9090]

# ntfy (8082) est le canal d'alerte de TOUTES les VM : sans cette exception, les
# tâches planifiées de cloud/media/firefly/security/scanner échouent en silence
# (constaté le 28/07/2026 — aucune de leurs alertes n'a jamais pu partir).
# Ouverture strictement limitée à ce port ; Grafana/Prometheus/Loki restent
# inaccessibles en direct depuis le VLAN services.
docker_ingress_port_exceptions:
  - port: 8082
    sources: [10.0.30.0/24]
