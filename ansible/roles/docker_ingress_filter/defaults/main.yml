---
# Ports Docker publiés qui ne doivent pas être joints directement par les VLANs.
docker_restricted_ports: []
docker_ingress_allowed_sources:
  - 10.0.30.10/32   # Traefik ET Uptime Kuma (tous deux sur infra depuis le 09/08/2026)
  - 10.0.100.0/24   # VLAN Admin / break-glass

# Exceptions CIBLEES : une source autorisee sur UN port precis uniquement.
# Evite d'ouvrir toute la liste des ports restreints a une source qui n'a besoin
# que d'un seul (cf. ntfy : toutes les VM doivent pouvoir alerter, aucune ne doit
# pouvoir joindre Grafana/Prometheus/Loki en direct).
docker_ingress_port_exceptions: []
