# =============================================================================
# services/infra/uptime-kuma/docker-compose.yml
# Uptime Kuma — supervision de disponibilité (sondes HTTP/TCP/ping/DNS/cert)
# et page de statut. Complète Prometheus (métriques) et les timers docker-health
# (santé conteneurs) : ici on teste "le service répond-il, de bout en bout ?".
# Notifications à brancher sur ntfy (support natif) : http://10.0.30.10:8082, topic homelab.
# Données (base SQLite + config) dans le volume ./data.
#
# Déplacé de la VM monitoring vers infra le 9 août 2026, dans le cadre de la
# décommission qui précède le déménagement : garder une VM de 8 Gio pour deux
# petits services n'avait plus de sens une fois Prometheus, Grafana, Loki et
# NetBox arrêtés.
# =============================================================================
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0@sha256:91e963bfda569ba115206e843febb446f473ab525add4e08b2b9e3beffa16985
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    environment:
      - TZ=Europe/Paris
    networks:
      # default = son propre réseau ; traefik-proxy = réseau partagé d'infra, pour
      # sonder les backends co-localisés par nom de conteneur (ex. authentik-server).
      # L'ancien réseau `monitoring` a disparu avec la VM du même nom.
      - default
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
    name: traefik-proxy
