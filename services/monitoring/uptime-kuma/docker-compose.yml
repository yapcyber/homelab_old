# =============================================================================
# services/monitoring/uptime-kuma/docker-compose.yml
# Uptime Kuma — supervision de disponibilité (sondes HTTP/TCP/ping/DNS/cert)
# et page de statut. Complète Prometheus (métriques) et les timers docker-health
# (santé conteneurs) : ici on teste "le service répond-il, de bout en bout ?".
# Notifications à brancher sur ntfy (support natif) : http://10.0.30.11:8082, topic homelab.
# Données (base SQLite + config) dans le volume ./data.
# =============================================================================
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0@sha256:a8610b3b4c38077922ba51b036691e06887d7cefd91fe620fd3d6d23d03dc240
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    environment:
      - TZ=Europe/Paris
    networks:
      # default = son propre réseau ; monitoring = réseau partagé (Grafana, Prometheus…)
      # pour sonder les backends co-localisés par nom de conteneur (ex. http://grafana:3000).
      - default
      - monitoring

networks:
  monitoring:
    external: true
    name: monitoring
